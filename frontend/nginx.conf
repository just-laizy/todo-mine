server {
    listen 80;
    root /usr/share/nginx/html;

    # API routes go to FastAPI. The (/|$) boundary matters: without it, ^/tasks
    # also matches tasks.html and the page gets proxied to the backend instead
    # of being served from disk (same for teams/stats/users .html).
    location ~ ^/(auth|tasks|teams|stats|admin|users|checklist-items)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API docs / health, handy when hitting the app through this port
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
